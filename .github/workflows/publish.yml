# Publishes every package to GitHub Packages when a release tag (v1.2.3) is pushed.
# Make one with `pnpm release:patch|minor|major` on main, then `git push --follow-tags`.
# To retry a failed publish, run this workflow manually on the release tag.
name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          # v5 auto-detects the packageManager field in package.json and tries to
          # resolve its cache dir immediately, before pnpm is installed below.
          package-manager-cache: false
      - run: npm install -g pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      # Prereleases (v1.2.0-rc.0) go to the "next" dist-tag so they never become "latest".
      - run: pnpm -r publish --no-git-checks --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
