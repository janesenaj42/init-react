# Runs PR-Agent (https://github.com/The-PR-Agent/pr-agent) on PRs, using OpenRouter
# as the model provider. Requires an OPENROUTER_API_KEY repo secret
# (Settings > Secrets and variables > Actions).
name: PR Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
permissions:
  issues: write
  pull-requests: write
  contents: write
jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent action step
        uses: The-PR-Agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIG__MODEL: "openrouter/qwen/qwen3.8-27b:free"
          # Free-tier model isn't in litellm's known-model list, so give it an explicit context size.
          # Check https://openrouter.ai/qwen/qwen3.8-27b:free for the model's actual token limit.
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "32000"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"
