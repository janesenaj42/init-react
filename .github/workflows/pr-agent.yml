# Runs PR-Agent (https://github.com/The-PR-Agent/pr-agent) on PRs, using OpenRouter
# as the model provider. Requires an OPENROUTER_API_KEY repo secret
# (Settings > Secrets and variables > Actions).
name: PR Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
permissions:
  issues: write
  pull-requests: write
  contents: write
jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent action step
        uses: The-PR-Agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          config.model: "openrouter/anthropic/claude-sonnet-5"
          config.fallback_models: '["openrouter/openai/gpt-5-mini"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
