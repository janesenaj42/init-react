[config]
model = "openrouter/qwen/qwen3.8-27b:free"
fallback_models = ["openrouter/stealth/space-bunny-alpha"]
custom_model_max_tokens = 32000

[pr_reviewer]
inline_key_issues = true
extra_instructions = """
Apply an extremely strict maintainability standard, not just a correctness check.
Flag: files pushed from under 1000 lines to over 1000 lines without strong justification;
new ad-hoc conditionals or one-off branches bolted onto existing flows ("spaghetti growth");
thin wrappers/identity abstractions that add indirection without clarity; unnecessary casts,
`any`/`unknown`, or optional params that obscure the real contract; feature-specific logic
leaking into shared/canonical modules; bespoke helpers duplicating an existing canonical one;
unnecessarily sequential/non-atomic updates where independent work could be parallel or atomic.
Prefer a small number of high-conviction structural findings over a long list of nits. Be
direct and specific about the fix (e.g. "extract this into its own module", "reuse X instead
of duplicating it"), not vague ("this could be cleaner").
"""

[pr_code_suggestions]
commitable_code_suggestions = true
extra_instructions = """
Be ambitious: look for "code judo" moves -- restructurings that preserve behavior while making
the implementation dramatically simpler, not just local cleanup. Actively look for whole
branches, helpers, or conditional layers that can be deleted rather than rearranged. Prefer:
extracting a helper/pure function; splitting a file that crossed ~1000 lines; replacing
condition chains with a typed model or dispatcher; separating orchestration from business
logic; reusing an existing canonical helper instead of a near-duplicate; parallelizing
independent async work. Do not suggest a merely-tidier version of a messy idea when a
meaningfully simpler idea is visible.
"""
